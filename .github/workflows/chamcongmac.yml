name: Build ChamCongMac for Apple Silicon
on:
  push:
    branches: [chamcongmac-build]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify source and prepare app bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/ChamCongMac.app/Contents/{MacOS,Resources}
          xcrun swiftc -parse-as-library -O -target arm64-apple-macos13.0 -framework SwiftUI -framework AppKit ChamCongApp.swift -o dist/ChamCongMac.app/Contents/MacOS/ChamCongMac
          swift GenerateIcon.swift dist/large-icon.png
          mkdir -p dist/ChamCongMac.iconset
          for s in 16 32 128 256 512; do
            sips -s format png -z "$s" "$s" dist/large-icon.png --out "dist/ChamCongMac.iconset/icon_"$s"x"$s".png" >/dev/null
          done
          for s in 16 32 128 256 512; do
            d=$((s*2))
            sips -s format png -z "$d" "$d" dist/large-icon.png --out "dist/ChamCongMac.iconset/icon_"$s"x"$s"@2x.png" >/dev/null
          done
          iconutil -c icns dist/ChamCongMac.iconset -o dist/ChamCongMac.app/Contents/Resources/AppIcon.icns
          cat > dist/ChamCongMac.app/Contents/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleExecutable</key><string>ChamCongMac</string>
          <key>CFBundleIdentifier</key><string>vn.chamcong.mac</string>
          <key>CFBundleName</key><string>ChamCongMac</string>
          <key>CFBundleDisplayName</key><string>Chấm Công Mac</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleIconFile</key><string>AppIcon</string>
          <key>CFBundleShortVersionString</key><string>1.0.0</string>
          <key>CFBundleVersion</key><string>1</string>
          <key>LSMinimumSystemVersion</key><string>13.0</string>
          <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          plutil -lint dist/ChamCongMac.app/Contents/Info.plist
          codesign --force --deep --sign - dist/ChamCongMac.app
          codesign --verify --deep --strict --verbose=2 dist/ChamCongMac.app
          file dist/ChamCongMac.app/Contents/MacOS/ChamCongMac
          ditto -c -k --keepParent dist/ChamCongMac.app dist/ChamCongMac-AppleSilicon.zip
          mkdir -p dist/dmg
          cp -R dist/ChamCongMac.app dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname 'Chấm Công Mac' -srcfolder dist/dmg -ov -format UDZO dist/ChamCongMac-AppleSilicon.dmg
      - name: Publish install packages
        uses: actions/upload-artifact@v4
        with:
          name: ChamCongMac-AppleSilicon
          path: |
            dist/ChamCongMac-AppleSilicon.zip
            dist/ChamCongMac-AppleSilicon.dmg
          if-no-files-found: error
          retention-days: 30
