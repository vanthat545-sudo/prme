name: AI Video Vietnamese localization audit
on:
  push:
    branches: [feat/ai-video-vietnamese]
    paths: [translations/**]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-vietnamese:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check all English catalog keys have Vietnamese entries
        run: python3 tools/audit_vi_catalog.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AI-Video-Vietnamese-Catalog-Audit
          path: translation-audit.json
          if-no-files-found: warn
          retention-days: 14
