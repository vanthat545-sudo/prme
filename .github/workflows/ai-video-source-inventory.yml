name: AI Video source inventory
on:
  push:
    branches: [feat/ai-video-vietnamese]
    paths: ['.github/workflows/ai-video-source-inventory.yml', 'tools/inspect_source.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect FilmCraft source archive and UI structure
        run: python3 tools/inspect_source.py
